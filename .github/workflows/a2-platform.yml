name: A2 locked platform evidence
on:
  workflow_call:
permissions:
  contents: read
jobs:
  a2-release:
    name: A2 required evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
          allow-prereleases: false
      - name: Read exact R lock
        id: lock
        run: python -c 'import json,os; f=open(os.environ["GITHUB_OUTPUT"],"a"); print("R="+json.load(open("tests/a2/fixture-lock.json"))["R"],file=f)'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.lock.outputs.R }}
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'
      - name: Install Linux system libraries for locked R dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff-dev libjpeg-dev
      - name: Provision locked fixture dependencies
        run: Rscript --vanilla scripts/provision_a2.R
      - name: Install Python and build dependencies
        run: python -m pip install 'pytest==8.4.2' pyyaml mkdocs-material mkdocs-macros-plugin pillow cairosvg
      - name: Run required collection and execution
        env:
          A2_PLATFORM: ${{ matrix.os }}
        run: python scripts/run_a2_release.py --output a2-release-evidence
      - name: Upload evidence including failure records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2-release-evidence-${{ matrix.os }}
          path: a2-release-evidence/
          if-no-files-found: error
