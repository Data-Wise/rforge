name: A2 release evidence
on:
  workflow_dispatch:
    inputs:
      acceptance-evidence-run:
        description: Numeric completed workflow run ID containing the a2-acceptance-evidence artifact for this candidate; missing evidence blocks acceptance.
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  a2-release:
    name: A2 required evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read exact R lock
        id: lock
        run: python -c 'import json,os; f=open(os.environ["GITHUB_OUTPUT"],"a"); print("R="+json.load(open("tests/a2/fixture-lock.json"))["R"],file=f)'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.lock.outputs.R }}
      - name: Provision locked fixture dependencies
        run: Rscript --vanilla scripts/provision_a2.R
      - name: Install Python and build dependencies
        run: python -m pip install pytest pyyaml mkdocs-material mkdocs-macros-plugin pillow cairosvg
      - name: Run required collection and execution
        env:
          A2_PLATFORM: ${{ matrix.os }}
        run: python scripts/run_a2_release.py --output a2-release-evidence
      - name: Upload evidence including failure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-release-evidence-${{ matrix.os }}
          path: a2-release-evidence/
          if-no-files-found: error
  aggregate:
    name: Verify both retrieved A2 artifacts
    needs: a2-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: a2-release-evidence-*
          path: retrieved-a2-evidence
      - name: Validate evidence run identity
        env:
          A2_EVIDENCE_RUN: ${{ inputs.acceptance-evidence-run }}
        run: python -c 'import os; assert os.environ["A2_EVIDENCE_RUN"].isdigit(), "Numeric evidence run ID required"'
      - uses: actions/download-artifact@v4
        with:
          name: a2-acceptance-evidence
          run-id: ${{ inputs.acceptance-evidence-run }}
          github-token: ${{ github.token }}
          path: retrieved-a2-observations
      - name: Verify source-bound artifacts and actual completed observations
        env:
          A2_EVIDENCE_RUN: ${{ inputs.acceptance-evidence-run }}
        run: python scripts/verify_a2_aggregate.py --artifacts retrieved-a2-evidence --observations retrieved-a2-observations/index.json --observation-artifacts retrieved-a2-observations --candidate-sha "$GITHUB_SHA" --producer-run-id "$A2_EVIDENCE_RUN"
